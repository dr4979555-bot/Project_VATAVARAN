<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="grad" cx="50%" cy="50%" r="50%" fx="30%" fy="30%">
      <stop offset="0%" stop-color="#b22222" />
      <stop offset="60%" stop-color="#8b1a1a" />
      <stop offset="100%" stop-color="#1a1510" />
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f4efe4" />
      <stop offset="100%" stop-color="#c0a878" />
    </linearGradient>
  </defs>
  <!-- Background Shield -->
  <rect x="4" y="4" width="56" height="56" rx="12" fill="url(#grad)" stroke="#a08858" stroke-width="2.5" />
  
  <!-- Radar concentric circles -->
  <circle cx="32" cy="32" r="22" fill="none" stroke="#e0d6c3" stroke-width="1" stroke-dasharray="3,3" opacity="0.4" />
  <circle cx="32" cy="32" r="14" fill="none" stroke="#e0d6c3" stroke-width="1" stroke-dasharray="2,2" opacity="0.6" />
  <circle cx="32" cy="32" r="6" fill="#e0d6c3" opacity="0.3" />

  <!-- Radar sweep line -->
  <line x1="32" y1="32" x2="48" y2="18" stroke="#fefcf7" stroke-width="2" stroke-linecap="round" opacity="0.8" />

  <!-- Cyclone / Anomaly Spiral -->
  <path d="M 32 16 C 41 16, 48 23, 48 32 C 48 38, 43 43, 37 43 C 33 43, 30 40, 30 36 C 30 33, 33 30, 36 30 C 38 30, 40 32, 40 34" 
        fill="none" stroke="url(#gold)" stroke-width="3" stroke-linecap="round" />
  
  <!-- Center pulse dot -->
  <circle cx="32" cy="32" r="3" fill="#fefcf7" />
</svg>
