<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="404 Not Found — The requested coordinate or meteorological record is absent from the Project VATAWARAN archives.">
  <title>404 Not Found · Project VATAWARAN</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper-0: #fefcf7; --paper-1: #faf7f0; --paper-2: #f4efe4;
      --ink-deep: #1a1510; --ink-base: #2c2418; --ink-mid: #4a3f2f; --ink-light: #594935;
      --red: #8b1a1a; --rule: #c0a878; --rule-light: #ddd0b8;
      --font-display: 'Playfair Display', Georgia, serif;
      --font-body: 'EB Garamond', Georgia, serif;
      --font-mono: 'IBM Plex Mono', Courier, monospace;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--paper-1);
      color: var(--ink-base);
      font-family: var(--font-body);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      max-width: 620px;
      width: 100%;
      background: var(--paper-0);
      border: 3px double var(--rule);
      box-shadow: 0 4px 24px rgba(44, 36, 24, 0.08);
      padding: 48px;
      text-align: center;
    }
    .emblem {
      font-size: 48px;
      margin-bottom: 12px;
    }
    .code {
      font-family: var(--font-mono);
      font-size: 13px;
      font-weight: 700;
      color: var(--red);
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    h1 {
      font-family: var(--font-display);
      font-size: 36px;
      color: var(--ink-deep);
      margin-bottom: 12px;
    }
    .rule {
      height: 2px;
      background: var(--rule);
      width: 80px;
      margin: 16px auto;
    }
    p {
      color: var(--ink-mid);
      font-size: 18px;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .cta-group {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .btn {
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 600;
      padding: 10px 18px;
      border-radius: 3px;
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: all 0.2s ease;
    }
    .btn-primary {
      background: var(--red);
      color: #fff;
      border: 1px solid var(--red);
    }
    .btn-primary:hover { background: #b22222; }
    .btn-secondary {
      background: var(--paper-2);
      color: var(--ink-deep);
      border: 1px solid var(--rule);
    }
    .btn-secondary:hover { background: #e8ded0; }
  </style>
</head>
<body>
  <div class="card">
    <div class="emblem">🧭</div>
    <div class="code">Error 404 · Coordinate Absent</div>
    <h1>Missing Atmospheric Dossier</h1>
    <div class="rule"></div>
    <p>The synoptic record, telemetry track, or endpoint you requested cannot be located in the current meteorological archives.</p>
    <div class="cta-group">
      <a href="/" class="btn btn-primary">Return to Bulletin</a>
      <a href="/docs" class="btn btn-secondary">API Documentation</a>
    </div>
  </div>
</body>
</html>
